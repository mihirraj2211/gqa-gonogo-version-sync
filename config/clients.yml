# Go/No-Go sign-off sync configuration.
#
# `clients` maps each row of the Confluence Go/No-Go table to the platform key
# returned by the build API. Row matching is case- and punctuation-insensitive,
# so "Apple iOS / tvOS" matches "apple ios/tvos".

release:
  # Fallback train, used only when the page title carries no version and no
  # RELEASE_TRAIN override is set.
  train: "7.12.0"
  branch_max: "release/beam/7.12.0"
  branch_dplus: "release/dplus/7.12.0"
  # Refuse to publish a version whose train does not match the resolved train.
  enforce_train: true
  # Read the train from the page title ("Copy of 7.12.0 Build GQA App Sign off"
  # -> 7.12.0), so moving to the next train is a page id change, not a code
  # change. Precedence: RELEASE_TRAIN override > page title > `train` above.
  train_from_page_title: true
  # The API reports D-Plus as its own product, so write what it says. The +14
  # store-offset derivation below stays as the fallback for platforms the
  # D-Plus feed does not cover.
  dplus_from_source: true

confluence:
  domain: wbdstreaming.atlassian.net
  page_id: "4137255661"  # Copy of 7.12.0 Build GQA App Sign off
  version_message: "Automated build version sync"
  # Column headers to locate in the sign-off table. First match wins.
  columns:
    client: ["Client", "Platform", "Client / Platform"]
    max: ["MAX Version Number", "MAX Version", "MAX Build", "MAX"]
    dplus: ["DPlus Version Number", "D+ Version Number", "DPlus Version", "DPLUS", "D+"]

# Wired to the Fuse build API documented on "Build Fetch API - curl Reference".
#
#   FUSE_BUILDS_API_URL=https://sprintedge.gqa.discomax.com/sprintedge/fuse/api/latest-versions
#   FUSE_API_TOKEN=<gate token>
#
# /api/latest-versions returns one card per device for one product, so the two
# sign-off columns are two calls: product=Max fills MAX, product=D-Plus fills
# DPlus. TNT-Sports and TVE are other products of the same API and are not part
# of this sign-off; TVE would additionally need a `brand` (network) parameter.
source:
  # fuse_api | grafana | jfrog | file
  provider: fuse_api
  url_env: FUSE_BUILDS_API_URL
  token_env: FUSE_API_TOKEN
  # How the token is sent:
  #   query  -> ?<options.auth_param>=<token>, what this API gates JSON routes on
  #   bearer -> Authorization: Bearer <token>
  #   token  -> Authorization: Token <token>
  #   basic  -> Authorization: Basic base64(<token>), "user:secret" or bare key
  #   jfrog  -> X-JFrog-Art-Api: <token>
  #   header -> a custom header named by options.auth_header
  #   none   -> no auth
  auth: query
  options:
    auth_param: token   # a JFrog api_token does not open the JSON routes
  # get | post. POST sends `body` below as JSON, for query-style endpoints.
  method: get
  timeout_seconds: 30
  # Sent on every call. Date tokens are expanded per run: {today}, {yesterday},
  # {tomorrow}, {now} and {epoch_ms}, each accepting a strftime format.
  query:
    # Orange (integration) | Blue (staging) | Green (release candidate / prod).
    # Blue is what this sign-off tracks; the grid's default view is Orange, so
    # numbers here will not always match what the dashboard shows on screen.
    environment: Blue
    # `flavour` (BASE | EMEA | AMER) applies to Swift iOS/tvOS only and is left
    # unset, which the API reads as AMER.
    # The API defaults requested_date to today in its own timezone, which is
    # usually what you want; set this only to pin a date.
    # requested_date: "{today}"
  # One call per entry, merged by device. This is where MAX and D+ come from.
  brand_requests:
    - brand: max
      query: { product: Max }
    - brand: dplus
      query: { product: D-Plus }
  # How to read the response payload. `python -m gonogo.probe --show-payload`
  # prints the real payload and a suggested block to paste here.
  response:
    records_path: devices     # { "devices": [ ...cards... ], "cache_expires_at": ... }
    platform_field: name
    version_field: version
    built_at_field: date
    # No brand_field: the product is chosen per call above, so every record in
    # a response belongs to that call's brand.
    #
    # If a payload ever labels both brands inside one card, these apply. Lists
    # are preference order, first match wins; a label in neither list is
    # ignored. The grid shows HBOMAX and BENELUX blocks per card, and only
    # HBOMAX belongs in the MAX column.
    max_brand_value: [max, hbomax, benelux]
    dplus_brand_value: [dplus, d plus, discovery, discoveryplus]
    # brand_versions_field: versions
    # Set to the field behind the grid's LIVE badge to prefer the promoted
    # build over a newer one of the same brand.
    # live_field: isLive
    #
    # `version` may also be N/A, ComingSoon, NotBuilt or Error rather than a
    # number. Those are reported and skipped, never written to a cell.

# `platform` must be one of the API's supported devices, folded to lowercase
# without punctuation: firetablet, android, firetv, androidtv, tvos, ios, roku,
# samsung, lg, xbox, web, playstation4, playstation5.
#
# AAOS, Vega, Chromecast and VisionOS are not devices this API builds for, so
# those rows report "no build reported" every run and their cells are left
# alone. Keep them listed: if the API gains the device, the row starts filling
# with no change here.
clients:
  - row: "Web"
    aliases: ["Web / idp Web", "idp Web", "Web (idp)"]
    platform: web
    source_repo: wbd-beam-typescript
    dplus_scheme: base

  - row: "Apple iOS"
    aliases: ["iOS", "Apple iOS / tvOS", "iPhone"]
    platform: ios
    source_repo: wbd-beam-apple
    dplus_scheme: offset

  - row: "Apple tvOS"
    aliases: ["tvOS", "Apple TV"]
    platform: tvos
    source_repo: wbd-beam-apple
    dplus_scheme: offset

  - row: "Apple VisionOS"
    aliases: ["VisionOS", "Vision Pro"]
    platform: visionos
    source_repo: wbd-beam-apple
    dplus_scheme: none  # D+ not shipped on VisionOS; cell is left untouched

  - row: "Android Mobile"
    aliases: ["Android", "Android Phone / Tablet"]
    platform: android
    source_repo: wbd-beam-android
    dplus_scheme: offset

  - row: "AAOS"
    aliases: ["Android Automotive", "Android AAOS"]
    platform: aaos
    source_repo: wbd-beam-android
    dplus_scheme: offset

  - row: "Fire Tablet"
    aliases: ["FireTablet", "Fire Tab", "Amazon Fire Tablet"]
    platform: firetablet
    source_repo: wbd-beam-android
    dplus_scheme: offset

  - row: "Android TV"
    aliases: ["AndroidTV", "Android TV (Leanback)"]
    platform: androidtv
    source_repo: wbd-beam-android
    dplus_scheme: offset

  - row: "Fire TV"
    aliases: ["FireTV", "Amazon Fire TV"]
    platform: firetv
    source_repo: wbd-beam-android
    dplus_scheme: offset

  - row: "Vega"
    aliases: ["Amazon Vega", "Vega OS"]
    platform: vega
    source_repo: wbd-beam-android
    dplus_scheme: offset

  # The API exposes Samsung and LG as separate devices; the CDEV sign-off row is
  # driven from the Samsung build. Add an "LG" row below if the table has one.
  - row: "CDEV"
    aliases: ["CDEV (Samsung, Bounty Flow, Linux)", "Samsung", "LG", "Linux", "CTV"]
    platform: samsung
    source_repo: wbd-beam-typescript
    dplus_scheme: base

  - row: "Roku"
    aliases: ["Roku TV", "Roku Player"]
    platform: roku
    source_repo: wbd-beam-brightscript
    dplus_scheme: base

  - row: "Chromecast"
    aliases: ["Chromecast with Google TV", "Google TV"]
    platform: chromecast
    source_repo: wbd-beam-typescript
    dplus_scheme: base

  # The API also builds LG, Xbox, playstation-4 and playstation-5. These rows are
  # off until the sign-off table is confirmed to carry them, because a row this
  # repo doesn't list is never touched - which is the safer default.
  # - row: "LG"
  #   aliases: ["LG webOS"]
  #   platform: lg
  #   source_repo: wbd-beam-typescript
  #   dplus_scheme: base
  #
  # - row: "Xbox"
  #   aliases: ["Xbox Series X/S", "Xbox One"]
  #   platform: xbox
  #   source_repo: wbd-beam-typescript
  #   dplus_scheme: base
  #
  # - row: "Playstation 4"
  #   aliases: ["PS4", "playstation-4"]
  #   platform: playstation4
  #   source_repo: wbd-beam-typescript
  #   dplus_scheme: base
  #
  # - row: "Playstation 5"
  #   aliases: ["PS5", "playstation-5"]
  #   platform: playstation5
  #   source_repo: wbd-beam-typescript
  #   dplus_scheme: base
