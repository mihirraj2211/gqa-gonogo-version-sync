# Maps each row of the Confluence Go/No-Go table to the build API's platform
# keys. Row and alias matching ignores case and punctuation.

release:
  # Used only when the page title carries no version and RELEASE_TRAIN is unset.
  train: "7.12.0"
  branch_max: "release/beam/7.12.0"
  branch_dplus: "release/dplus/7.12.0"
  enforce_train: true
  train_from_page_title: true
  # D+ is its own product, so its version is written as reported and a platform
  # reporting none (iOS, tvOS) keeps its cell. Turning this on borrows the MAX
  # octet instead, publishing a build number nobody can install.
  derive_missing_dplus: false

confluence:
  domain: wbdstreaming.atlassian.net
  # Blank: each run finds the current train's page by title, which is what
  # carries the sync to 7.13.0 on its own. Set CONFLUENCE_PAGE_ID to pin one
  # page, which is how a "Copy of ..." page is used to rehearse.
  page_id: ""
  space_key: GQA
  # {train} is 7.12.0, {train_short} 7.12. Matched loosely, but an exact title
  # beats a copy, and two equal matches are an error rather than a guess.
  title_template: "{train} Build GQA App Sign off"
  version_message: "Automated build version sync"
  # The table shows versions as inline code, so write them that way; "plain"
  # writes bare text. A cell holding the right version in the wrong markup is
  # rewritten, which is how rows an earlier run left plain get picked up.
  cell_format: code
  # First header match wins.
  columns:
    client: ["Client", "Platform", "Client / Platform"]
    max: ["MAX Version Number", "MAX Version", "MAX Build", "MAX"]
    dplus: ["DPlus Version Number", "D+ Version Number", "DPlus Version", "DPLUS", "D+"]

# FUSE_BUILDS_API_URL=https://sprintedge.gqa.discomax.com/sprintedge/fuse/api/latest-versions
# /api/latest-versions serves one product per call, so the two sign-off columns
# are two calls. TNT-Sports and TVE are other products of the same API.
source:
  # fuse_api | grafana | jfrog | file
  provider: fuse_api
  url_env: FUSE_BUILDS_API_URL
  token_env: FUSE_API_TOKEN
  # query | bearer | token | basic | jfrog | header | none
  auth: query
  options:
    auth_param: token   # a JFrog api_token does not open the JSON routes
  # get | post, where post sends `body` as JSON.
  method: get
  timeout_seconds: 30
  # Sent on every call. Date tokens {today}, {yesterday}, {tomorrow}, {now} and
  # {epoch_ms} are expanded per run and accept a strftime format.
  query:
    # Orange (integration) | Blue (staging) | Green (RC/prod). Sign-off tracks
    # Blue; the dashboard opens on Orange, so its numbers can differ on screen.
    environment: Blue
    # requested_date: "{today}"   # defaults to today in the API's timezone
  # One call per entry, merged by device.
  brand_requests:
    - brand: max
      query: { product: Max }
    - brand: dplus
      query: { product: D-Plus }
  # `python -m gonogo.probe --show-payload` prints the payload and a suggested
  # block to paste here.
  response:
    records_path: devices
    platform_field: name
    version_field: version
    built_at_field: date
    # No brand_field: the product is per call, so a response is all one brand.
    # These apply only if a payload ever labels both brands in one card, in
    # preference order; a label in neither list is ignored.
    max_brand_value: [max, hbomax, benelux]
    dplus_brand_value: [dplus, d plus, discovery, discoveryplus]
    # brand_versions_field: versions
    # live_field: isLive   # prefer the promoted build over a newer one
    #
    # A `version` of N/A, ComingSoon, NotBuilt or Error is reported and skipped.

# The six rows of the table, in page order. Any row not listed here is never
# touched, which is what keeps the Notes and Go/No-Go columns safe.
#
# `platform` takes one or more API devices, lowercased without punctuation:
# firetablet, android, firetv, androidtv, tvos, ios, roku, samsung, lg, xbox,
# web, playstation4, playstation5. A row signs off an app family rather than a
# device, so most cover several: the first to report wins, and a run warns when
# they disagree, because one row cannot sign off two numbers.
clients:
  - row: "Web"
    aliases: ["Web / idp Web", "idp Web", "Web (idp)"]
    platform: web
    source_repo: wbd-beam-typescript
    dplus_scheme: base

  - row: "Roku"
    aliases: ["Roku TV", "Roku Player"]
    platform: roku
    source_repo: wbd-beam-brightscript
    dplus_scheme: base

  # One Swift tree for both. VisionOS is not a device this API builds.
  - row: "Apple"
    aliases: ["Apple iOS", "iOS", "tvOS", "Apple iOS / tvOS", "iPhone", "Apple TV"]
    platform: [ios, tvos]
    source_repo: wbd-beam-apple
    dplus_scheme: offset

  - row: "Android"
    aliases: ["Android Mobile", "Android Phone / Tablet", "Fire Tablet"]
    platform: [android, firetablet]
    source_repo: wbd-beam-android
    dplus_scheme: offset

  # Leanback: the TV form factor of the same Android app.
  - row: "LB"
    aliases: ["Leanback", "Android TV", "Fire TV", "AndroidTV", "FireTV"]
    platform: [androidtv, firetv]
    source_repo: wbd-beam-android
    dplus_scheme: offset

  # The CTV devices, reported separately by the API.
  - row: "CDEV"
    aliases: ["CDEV (Samsung, Bounty Flow, Linux)", "Samsung", "LG", "Linux", "CTV"]
    platform: [samsung, lg]
    source_repo: wbd-beam-typescript
    dplus_scheme: base

  # xbox, playstation4 and playstation5 are built but have no row to write.
