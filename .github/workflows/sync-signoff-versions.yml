name: Sync Go/No-Go build versions

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs on shared capacity, so
    # expect drift and occasional skipped ticks under load. `*/5` is the
    # platform floor; nothing shorter will fire.
    - cron: "*/15 * * * *"

  # Closest thing to live: a build pipeline that POSTs here gets the page
  # updated in about a minute instead of waiting for the next tick. Pass a train
  # in client_payload to write that train's page regardless of the feed.
  #   curl -X POST -H "Accept: application/vnd.github+json" \
  #        -H "Authorization: Bearer <PAT with repo scope>" \
  #        https://api.github.com/repos/${{ github.repository }}/dispatches \
  #        -d '{"event_type":"build-published",
  #             "client_payload":{"release_train":"7.13.0"}}'
  repository_dispatch:
    types: [build-published]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without publishing to Confluence"
        type: boolean
        default: true
      page_id:
        description: "Confluence page id (blank = find the train's page by title)"
        type: string
        required: false
      release_train:
        description: "Train, e.g. 7.13.0 (blank = read it from the page title)"
        type: string
        required: false
      page_title:
        description: "Find the page by this exact title instead (blank = from the train)"
        type: string
        required: false
      verbose:
        description: "Debug logging"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two runs publish page versions on top of each other.
  group: gonogo-signoff-sync
  cancel-in-progress: false

jobs:
  sync:
    # Set the SYNC_RUNNER repository variable to a self-hosted label when the
    # build API is only reachable from inside the WBD network.
    runs-on: ${{ vars.SYNC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    env:
      CONFLUENCE_DOMAIN: ${{ vars.CONFLUENCE_DOMAIN || 'wbdstreaming.atlassian.net' }}
      # Leave the CONFLUENCE_PAGE_ID variable unset and a scheduled run finds
      # the current train's page by title on its own: it reads the train from
      # the build feed, so the day 7.13.0 starts building it moves to the
      # 7.13.0 page with no variable to change. Setting the id pins one page.
      CONFLUENCE_PAGE_ID: ${{ inputs.page_id || vars.CONFLUENCE_PAGE_ID }}
      CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY || 'GQA' }}
      ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      FUSE_BUILDS_API_URL: ${{ secrets.FUSE_BUILDS_API_URL }}
      FUSE_API_TOKEN: ${{ secrets.FUSE_API_TOKEN }}
      JFROG_URL: ${{ secrets.JFROG_URL }}
      JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
      BUILD_PROVIDER: ${{ vars.BUILD_PROVIDER }}
      # Set this only to pin a train, e.g. to keep writing 7.12.0 while 7.13.0
      # builds appear. Unset means "whichever train the feed is building".
      RELEASE_TRAIN: >-
        ${{ inputs.release_train
            || github.event.client_payload.release_train
            || vars.RELEASE_TRAIN }}
      ENFORCE_TRAIN: ${{ vars.ENFORCE_TRAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without this, a missing secret fails the same way every 15 minutes with
      # a message that looks like an API problem rather than a setup problem.
      - name: Check credentials are configured
        run: |
          missing=()
          [ -n "$ATLASSIAN_USER_EMAIL" ] || missing+=(ATLASSIAN_USER_EMAIL)
          [ -n "$ATLASSIAN_API_TOKEN" ] || missing+=(ATLASSIAN_API_TOKEN)
          if [ "$BUILD_PROVIDER" = "jfrog" ]; then
            [ -n "$JFROG_URL" ] || missing+=(JFROG_URL)
          else
            [ -n "$FUSE_BUILDS_API_URL" ] || missing+=(FUSE_BUILDS_API_URL)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Sync sign-off versions
        run: |
          python -m gonogo.sync \
            --config config/clients.yml \
            ${{ inputs.page_title && format('--page-title "{0}"', inputs.page_title) || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.verbose) && '--verbose' || '' }}
